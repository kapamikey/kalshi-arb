# Always-on demo paper trader. Secrets go in `fly secrets`, never this file.
# Deploy from repo root: fly launch --config fly.toml --no-deploy && fly deploy
app = "kalshi-arb-demo-trader"
primary_region = "ewr"
[build]
  dockerfile = "trader/Dockerfile"
[env]
  KALSHI_ENV = "demo"
  KALSHI_REST_BASE = "https://external-api.demo.kalshi.co/trade-api/v2"
  KALSHI_WS_URL = "wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2"
  KALSHI_TRADING_ENABLED = "false"
  DEMO_ORDER_CONTRACTS = "1"
  CONTRACTS = "20"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
